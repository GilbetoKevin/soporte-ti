<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear reporte — Soporte TI Mota-Engil</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>

<div class="back-header">
  <div class="back-header-row"><a class="back-btn" href="index.html">← Volver</a><h2>Crear reporte</h2></div>
</div>
<div class="subview-body">
  <p class="hint">Se abrirá tu correo con los datos listos para enviar al equipo de TI.</p>
  <form id="report-form">
    <label>Nombre<input id="r-nombre" type="text" required></label>
    <label>Categoría
      <select id="r-categoria">
        <option>Impresoras</option><option>Red y VPN</option><option>Cuentas y accesos</option>
        <option>Equipo</option><option>Otro</option>
      </select>
    </label>
    <label>Descripción<textarea id="r-descripcion" rows="4" required></textarea></label>
    <button type="submit" class="submit-btn">Enviar por correo</button>
  </form>
</div>

<script src="js/theme-toggle.js"></script>
<script src="js/reporte.js"></script>
</body>
</html>
