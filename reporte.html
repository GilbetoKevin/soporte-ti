<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear reporte — Soporte TI Mota-Engil</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="back-header">
  <div class="back-header-row">
    <a class="home-btn" href="index.html" aria-label="Volver al inicio" title="Inicio">
      <img src="assets/img/logo.png" alt="">
      <span class="logo-word">MOTA-ENGIL</span>
    </a>
    <nav class="subpage-nav" aria-label="Navegación principal">
      <a class="subpage-link" href="soluciones.html">Soluciones</a>
      <a class="subpage-link" href="equipo.html">Equipo de TI</a>
      <a class="subpage-link active" href="reporte.html" aria-current="page">Crear reporte</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
    </div>
  </div>
</div>
<div class="subview-body">
  <p class="hint">Se abrirá tu correo con los datos listos para enviar al equipo de TI.</p>
  <form id="report-form">
    <label>Nombre<input id="r-nombre" type="text" required></label>
    <label>Categoría
      <select id="r-categoria">
        <option>Impresoras</option><option>Red y VPN</option><option>Cuentas y accesos</option>
        <option>Equipo</option><option>Otro</option>
      </select>
    </label>
    <label>Descripción<textarea id="r-descripcion" rows="4" required></textarea></label>
    <button type="submit" class="submit-btn">Enviar por correo</button>
  </form>
</div>

<script src="js/theme-toggle.js"></script>
<script src="js/reporte.js"></script>
</body>
</html>
